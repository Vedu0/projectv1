<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart RFID Inventory System</title>
  <link rel="stylesheet" href="style.css" />
  
</head>
<body>
   <nav class="navbar"><div class="logo">
    MIT CSN EE PROJECT
</div>
<div class="navbar-ops">
  <a href="index1.html">HOME</a>
    <a href="index.html">DASHBOARD</a>
    <a href="page2.html">ABOUT</a>
    <a href="page3.html">CONTACT US</a>
</div>
</nav>
  <div class="container">
    <header class="hero">
     
      <h1>
        SMART RFID
        <span>INVENTORY SYSTEM</span>
      </h1>

      <p>
        Real-time inventory tracking with LED status indication.
      </p>
    </header>

    <main class="dashboard">
      <section class="left-panel">
        <div id="containers"></div>
      </section>

      <aside class="right-panel">
        <h2>DASHBOARD PREVIEW</h2>

        <div class="stats">
          <div class="stat-box">
            <h3>Total Items</h3>
            <p id="totalItems">0</p>
          </div>

          <div class="stat-box">
            <h3>Low Stock</h3>
            <p class="yellow-text" id="lowStock">0</p>
          </div>

          <div class="stat-box">
            <h3>Empty</h3>
            <p class="red-text" id="emptyStock">0</p>
          </div>
        </div>

        <div class="activity">
          <h2>RECENT ACTIVITY</h2>
          <div id="activityLogs"></div>
        </div>
      </aside>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
